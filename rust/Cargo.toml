[package]
name = "provn-sdk"
version = "0.2.0"
edition = "2021"
description = "Universal, no-std Rust SDK for privacy-preserving digital signatures and data anchoring."
license = "MIT"
repository = "https://github.com/provnai/provn-sdk"
keywords = ["cryptography", "ed25519", "no-std", "identity", "anchoring"]
categories = ["cryptography", "no-std", "embedded"]

[features]
default = ["std"]
std = ["ed25519-dalek/std", "serde/std", "serde_json/std", "hex/std", "rand/std"]
alloc = ["serde/alloc", "serde_json/alloc", "hex/alloc", "ed25519-dalek/alloc", "rand/alloc"]
getrandom = ["rand/getrandom"]

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["rand_core", "serde"] }
rand = { version = "=0.8.5", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "=1.0.149", default-features = false }
hex = { version = "=0.4.3", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
