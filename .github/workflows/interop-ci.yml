name: Cross-SDK Interoperability

on:
  push:
    branches: [ main ]
    paths:
      - 'rust/**'
      - 'python/**'
      - 'go/**'
      - 'spec/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'rust/**'
      - 'python/**'
      - 'go/**'
      - 'spec/**'
  workflow_dispatch:

jobs:
  test-vectors:
    name: Test Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Rust tests
        working-directory: ./rust
        run: cargo test --all-features

      - name: Run Go tests against shared vectors
        working-directory: ./go
        run: go test -v ./...

      - name: Build and test Python SDK
        working-directory: ./python
        run: |
          python -m pip install --upgrade pip pytest maturin
          rm -rf target/wheels
          maturin build --release --interpreter python
          python -m pip install --force-reinstall "$(ls -t target/wheels/*.whl | head -n 1)"
          pytest -v
