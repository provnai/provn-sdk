name: Go CI

on:
  push:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'spec/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'spec/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Get dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -d .)" ]; then
            gofmt -d .
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: go build -v ./...
