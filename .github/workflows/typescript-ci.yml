name: TypeScript CI

on:
  push:
    branches: [ main ]
    paths:
      - 'typescript/**'
      - 'rust-wasm/**'
      - 'spec/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'typescript/**'
      - 'rust-wasm/**'
      - 'spec/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Install Rust for building WASM
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      # Build WASM
      - name: Build WASM
        working-directory: ./rust-wasm
        run: wasm-pack build --target bundler
      
      # Copy WASM to TypeScript
      - name: Copy WASM files
        run: |
          mkdir -p typescript/wasm
          cp rust-wasm/pkg/* typescript/wasm/
      
      # Setup Node and build TypeScript
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./typescript
        run: npm ci
      - name: Build
        working-directory: ./typescript
        run: npm run build
      - name: Run tests
        working-directory: ./typescript
        run: npm test
      - name: Lint
        working-directory: ./typescript
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Install Rust for building WASM
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      # Build WASM
      - name: Build WASM
        working-directory: ./rust-wasm
        run: wasm-pack build --target bundler
      
      # Copy WASM to TypeScript
      - name: Copy WASM files
        run: |
          mkdir -p typescript/wasm
          cp rust-wasm/pkg/* typescript/wasm/
      
      # Setup Node and type check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./typescript
        run: npm ci
      - name: Type check
        working-directory: ./typescript
        run: npx tsc --noEmit
