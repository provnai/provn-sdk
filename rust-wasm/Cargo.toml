[package]
name = "provn-sdk-wasm"
version = "0.3.0"
edition = "2021"
description = "WebAssembly bindings for Provncloud SDK"
license = "MIT"
repository = "https://github.com/provnai/provn-sdk"
keywords = ["cryptography", "ed25519", "wasm", "browser"]
categories = ["cryptography", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

default = []

[dependencies]
provn-sdk = { path = "../rust", default-features = false, features = ["alloc", "getrandom"] }
getrandom = { version = "=0.2.17", features = ["js"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }
hex = { version = "=0.4.3", default-features = false }
wasm-bindgen = { version = "=0.2.89", features = ["serde-serialize"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149" }
serde-wasm-bindgen = "=0.6.3"
js-sys = "=0.3.66"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "=0.1.7", optional = true }



[dependencies.web-sys]
version = "=0.3.66"
features = [
  "console",
]

[dev-dependencies]
wasm-bindgen-test = "=0.3.39"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
