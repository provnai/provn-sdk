[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "provn-sdk"
version = "0.3.3"
description = "Official Python SDK for privacy-preserving digital signatures and data anchoring"
readme = "README.md"
authors = [{name = "Provncloud", email = "dev@provn.ai"}]
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["cryptography", "ed25519", "signatures", "verification", "anchoring"]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/provnai/provn-sdk"
Repository = "https://github.com/provnai/provn-sdk.git"
Issues = "https://github.com/provnai/provn-sdk/issues"
Changelog = "https://github.com/provnai/provn-sdk/blob/main/CHANGELOG.md"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "provn_sdk.provn_sdk"
python-source = "src"
